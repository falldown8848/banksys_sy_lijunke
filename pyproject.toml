[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banksys"
version = "0.1.0"
description = "基于银行营销数据的分析 + 认购预测 Web 应用"
requires-python = ">=3.11"
dependencies = []  # 依赖统一由 requirements.txt 管理

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
# N803/N806:特征矩阵 X 与标签 y 是 sklearn/ML 惯例命名,保留大写。
# N818:异常类名后缀规则,本项目自定义异常不适用。
ignore = ["N818", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["banksys"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
