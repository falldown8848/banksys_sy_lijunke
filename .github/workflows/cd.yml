# CD:合并 main 后自动部署到服务器(SSH → rsync → deploy.sh)。
# 需 GitHub Secrets:SSH_PRIVATE_KEY / SSH_HOST / SSH_USER(见 standards/05 §5)。

name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH 密钥与目标信息
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          # 防御性处理:字面 \n 转真实换行 + 去除 CR,避免 Secret 换行损坏导致 libcrypto 报错
          printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # 诊断(不泄露私钥正文):行数 / 首尾标记 / 字面\n数 / 能否解析出公钥
          echo ">> diag: lines=$(wc -l < ~/.ssh/id_rsa)"
          echo ">> diag: head=[$(head -c 30 ~/.ssh/id_rsa)]"
          echo ">> diag: tail=[$(tail -c 30 ~/.ssh/id_rsa)]"
          echo ">> diag: literal_backslash_n=$(grep -c '\\n' ~/.ssh/id_rsa || true)"
          echo ">> diag: pubkey_parse =>"
          ssh-keygen -y -f ~/.ssh/id_rsa 2>&1 | head -1 || true
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "SSH_USER=$SSH_USER" >> "$GITHUB_ENV"

      - name: 同步代码到服务器
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.venv' --exclude 'models' \
            ./ "${SSH_USER}@${SSH_HOST}:/opt/banksys_sy_lijunke/"

      - name: 远程构建并部署
        run: |
          ssh "${SSH_USER}@${SSH_HOST}" \
            'cd /opt/banksys_sy_lijunke && SSH_HOST="'"$SSH_HOST"'" bash deploy.sh'
